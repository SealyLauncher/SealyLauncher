[workspace]
resolver = "3"
members = [
    "crates/sealy-core",
    "crates/sealy-ui",
    "crates/sealy-app",
]

[workspace.package]
version = "0.1.20"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.99.1"
publish = false

[workspace.dependencies]
gpui-kit = "=0.9.0"
sealy-core = { path = "crates/sealy-core" }
sealy-ui = { path = "crates/sealy-ui" }
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
md-5 = "0.10"
thiserror = "2"
ureq = { version = "2", default-features = false, features = [
    "json",
    "native-tls",
] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
