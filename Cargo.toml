[workspace]
resolver = "3"
members = [
    "crates/sealy-core",
    "crates/sealy-ui",
    "crates/sealy-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.99.1"
publish = false

[workspace.dependencies]
gpui-kit = "=0.9.0"
sealy-core = { path = "crates/sealy-core" }
sealy-ui = { path = "crates/sealy-ui" }
tracing = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
