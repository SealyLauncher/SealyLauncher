<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>SealyLauncher · 方向 06</title>
<style>
  :root {
    --canvas: #f4f3f0;
    --surface: #ffffff;
    --line: #e4e1db;
    --line-soft: #eeebe5;
    --ink: #14130f;
    --ink-2: #4a4640;
    --muted: #8a857c;
    --accent: #f1641e;
    --accent-soft: #ffece2;
    --night: #14121f;
    --r-window: 14px;
    --r-card: 10px;
    --r-pill: 999px;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --font: "Segoe UI Variable Text", "Segoe UI", "PingFang SC", "Microsoft YaHei UI", system-ui, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    display: grid;
    place-items: center;
    background: #d9d7d2;
    font-family: var(--font);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  .win {
    position: relative;
    width: 1280px;
    height: 800px;
    background: var(--canvas);
    border-radius: var(--r-window);
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(20, 19, 15, 0.28), 0 2px 6px rgba(20, 19, 15, 0.12);
    display: flex;
    flex-direction: column;
  }

  /* ---------- traffic lights ---------- */
  .traffic {
    position: absolute;
    top: 16px;
    left: 18px;
    display: flex;
    gap: 8px;
    z-index: 5;
  }
  .traffic i {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    display: block;
  }
  .traffic i:nth-child(1) { background: #ff5f57; }
  .traffic i:nth-child(2) { background: #febc2e; }
  .traffic i:nth-child(3) { background: #28c840; }

  /* ---------- hero ---------- */
  .hero {
    position: relative;
    height: 372px;
    flex: none;
    overflow: hidden;
    background: var(--night);
  }
  .hero svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    image-rendering: pixelated;
  }
  .hero::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(90deg, rgba(8, 7, 14, 0.82) 0%, rgba(8, 7, 14, 0.45) 42%, rgba(8, 7, 14, 0) 68%),
      linear-gradient(180deg, rgba(8, 7, 14, 0.35) 0%, rgba(8, 7, 14, 0) 30%);
  }

  .hero-copy {
    position: absolute;
    left: 40px;
    bottom: 34px;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
  }
  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 600;
    color: #f4f2ee;
    letter-spacing: 0.01em;
  }
  .eyebrow i {
    width: 9px;
    height: 9px;
    display: block;
    background: var(--accent);
  }
  .hero h1 {
    font-size: 40px;
    line-height: 1.1;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: #ffffff;
  }
  .hero .meta {
    font-size: 13.5px;
    color: rgba(255, 255, 255, 0.62);
    letter-spacing: 0.01em;
  }

  .primary {
    margin-top: 8px;
    display: inline-flex;
    align-items: center;
    gap: 9px;
    height: 44px;
    padding: 0 22px;
    border: 0;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    box-shadow: inset 0 -1px 0 rgba(0, 0, 0, 0.18);
    transition: background 0.16s var(--ease), transform 0.16s var(--ease);
  }
  .primary:hover { background: #ff7a35; }
  .primary:active { transform: translateY(1px); }
  .primary svg { width: 17px; height: 17px; }

  /* ---------- dither seam ---------- */
  .seam {
    height: 34px;
    flex: none;
    background: var(--canvas);
    display: block;
    width: 100%;
  }

  /* ---------- body ---------- */
  .body {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: 1fr 424px;
    gap: 24px;
    padding: 6px 40px 0;
  }
  .col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .label {
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.01em;
  }

  .empty {
    border: 1px solid var(--line);
    border-radius: var(--r-card);
    background: var(--surface);
    padding: 20px 24px 22px;
    display: flex;
    flex-direction: column;
    gap: 7px;
    align-self: start;
    width: 100%;
  }
  .empty .t { font-size: 15px; font-weight: 600; color: var(--ink); }
  .empty .h { font-size: 13px; color: var(--muted); line-height: 1.5; }

  .stats {
    border-radius: var(--r-card);
    background: #262524;
    padding: 20px 22px 18px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  .stat .k {
    font-size: 11.5px;
    color: rgba(255, 255, 255, 0.5);
    margin-bottom: 12px;
    letter-spacing: 0.02em;
  }
  .stat .v { display: flex; align-items: center; gap: 6px; }
  .stat svg { height: 26px; width: auto; display: block; }
  .stat .unit {
    font-size: 11px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.42);
    letter-spacing: 0.08em;
  }

  /* ---------- footer ---------- */
  .foot {
    flex: none;
    height: 92px;
    display: flex;
    align-items: center;
    padding: 0 24px 8px;
    gap: 16px;
  }
  .crumbs {
    display: flex;
    align-items: center;
    gap: 2px;
    height: 42px;
    padding: 0 8px 0 4px;
    border-radius: var(--r-card);
    background: var(--surface);
    border: 1px solid var(--line);
  }
  .crumb-btn {
    width: 34px;
    height: 32px;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: var(--ink-2);
    cursor: pointer;
  }
  .crumb-btn:hover { background: var(--line-soft); }
  .crumb-btn:disabled { color: #cdc9c2; }
  .crumbs .here {
    padding: 0 12px 0 6px;
    font-size: 14px;
    font-weight: 600;
  }

  .dock-wrap { flex: 1; display: flex; justify-content: center; }
  .dock {
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 6px;
    border-radius: 12px;
    background: var(--surface);
    border: 1px solid var(--line);
    box-shadow: 0 2px 10px rgba(20, 19, 15, 0.06);
  }
  .dock button {
    position: relative;
    width: 52px;
    height: 44px;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: 9px;
    background: transparent;
    color: var(--ink-2);
    cursor: pointer;
    transition: background 0.14s var(--ease);
  }
  .dock button:hover { background: var(--line-soft); }
  .dock button.on { background: var(--accent-soft); color: var(--accent); }
  .dock button.on::after {
    content: "";
    position: absolute;
    bottom: 3px;
    left: 50%;
    transform: translateX(-50%);
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--accent);
  }
  .dock svg { width: 20px; height: 20px; }

  .right {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .who {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 42px;
    height: 42px;
    border-radius: 10px;
    background: #fff;
    border: 1px solid var(--line);
    font-size: 15px;
    font-weight: 700;
    color: #8b2fa8;
    cursor: pointer;
  }
  .instance {
    display: flex;
    align-items: center;
    gap: 9px;
    height: 42px;
    padding: 0 12px 0 8px;
    border-radius: 10px;
    background: var(--surface);
    border: 1px solid var(--line);
    cursor: pointer;
  }
  .instance .ico {
    width: 26px;
    height: 26px;
    border-radius: 6px;
    background: #cfe8ff;
    display: grid;
    place-items: center;
    overflow: hidden;
  }
  .instance .ico svg { width: 26px; height: 26px; display: block; image-rendering: pixelated; }
  .instance .name { font-size: 13.5px; font-weight: 600; }
  .instance .caret { width: 14px; height: 14px; color: var(--muted); }
</style>
</head>
<body>
  <div class="win">
    <div class="traffic"><i></i><i></i><i></i></div>

    <section class="hero">
      <svg id="scene" viewBox="0 0 160 90" preserveAspectRatio="none" aria-hidden="true"></svg>
      <div class="hero-copy">
        <div class="eyebrow"><i></i>接着上次</div>
        <h1>Fabric 1.21.11</h1>
        <div class="meta">1.21.11 · Fabric · 还没玩过</div>
        <button class="primary">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.2v13.6L19 12z"/></svg>
          继续
        </button>
      </div>
    </section>

    <svg class="seam" id="seam" viewBox="0 0 160 8" preserveAspectRatio="none" aria-hidden="true"></svg>

    <main class="body">
      <div class="col">
        <div class="label">接着玩</div>
        <div class="empty">
          <div class="t">还没有世界</div>
          <div class="h">按「继续」进入游戏，创建的世界会出现在这里</div>
        </div>
      </div>
      <div class="col">
        <div class="label">游戏记录</div>
        <div class="stats">
          <div class="stat">
            <div class="k">游玩时间</div>
            <div class="v"><svg id="d-min" viewBox="0 0 24 26"></svg><span class="unit">MIN</span></div>
          </div>
          <div class="stat">
            <div class="k">世界</div>
            <div class="v"><svg id="d-world" viewBox="0 0 24 26"></svg></div>
          </div>
          <div class="stat">
            <div class="k">服务器</div>
            <div class="v"><svg id="d-server" viewBox="0 0 24 26"></svg></div>
          </div>
        </div>
      </div>
    </main>

    <footer class="foot">
      <div class="crumbs">
        <button class="crumb-btn" disabled aria-label="后退">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 6-6 6 6 6"/></svg>
        </button>
        <button class="crumb-btn" disabled aria-label="前进">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg>
        </button>
        <span class="here">首页</span>
      </div>

      <div class="dock-wrap">
        <nav class="dock">
          <button class="on" aria-label="首页">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg>
          </button>
          <button aria-label="实例">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="6.5" width="7" height="11" rx="1.4"/><rect x="13.5" y="6.5" width="7" height="11" rx="1.4"/></svg>
          </button>
          <button aria-label="下载">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.2"/><path d="M12 8.4v6.4M9.4 12.2 12 14.8l2.6-2.6"/></svg>
          </button>
          <button aria-label="活动">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3.5 14h4l2.6-7 3.2 11 2.5-6h4.7"/></svg>
          </button>
          <button aria-label="账号">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="9" r="3.4"/><path d="M5.5 19.5a6.5 6.5 0 0 1 13 0"/></svg>
          </button>
          <button aria-label="设置">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="2.6"/><path d="M12 4v2.2M12 17.8V20M4 12h2.2M17.8 12H20M6.3 6.3l1.6 1.6M16.1 16.1l1.6 1.6M17.7 6.3l-1.6 1.6M7.9 16.1l-1.6 1.6"/></svg>
          </button>
        </nav>
      </div>

      <div class="right">
        <div class="who">L</div>
        <div class="instance">
          <div class="ico"><svg id="block" viewBox="0 0 16 16"></svg></div>
          <span class="name">Fabric 1.21.11</span>
          <svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m7 10 5 5 5-5"/></svg>
        </div>
      </div>
    </footer>
  </div>

<script>
// Deterministic PRNG so the art is stable across renders.
function rng(seed) {
  return function () {
    seed |= 0;
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const NS = "http://www.w3.org/2000/svg";
const px = (parent, x, y, w, h, fill, opacity) => {
  const r = document.createElementNS(NS, "rect");
  r.setAttribute("x", x);
  r.setAttribute("y", y);
  r.setAttribute("width", w);
  r.setAttribute("height", h);
  r.setAttribute("fill", fill);
  if (opacity !== undefined) r.setAttribute("opacity", opacity);
  parent.appendChild(r);
};

/* ---------------- hero pixel scene ---------------- */
(function scene() {
  const svg = document.getElementById("scene");
  const W = 160, H = 90;
  const r = rng(20261108);

  // sky gradient
  const defs = document.createElementNS(NS, "defs");
  defs.innerHTML =
    '<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0" stop-color="#0e0d19"/><stop offset="0.55" stop-color="#171528"/>' +
    '<stop offset="0.85" stop-color="#221a33"/><stop offset="1" stop-color="#2a2038"/>' +
    "</linearGradient>";
  svg.appendChild(defs);
  px(svg, 0, 0, W, H, "url(#sky)");

  // stars
  for (let i = 0; i < 190; i++) {
    const x = Math.floor(r() * W);
    const y = Math.floor(r() * 52);
    const s = r() < 0.82 ? 1 : 2;
    const a = 0.18 + r() * 0.6;
    px(svg, x, y, s, s, r() < 0.12 ? "#ffd9a8" : "#d9d6f0", a.toFixed(2));
  }

  // nebula streaks
  for (let i = 0; i < 16; i++) {
    px(svg, Math.floor(r() * 150), 4 + Math.floor(r() * 34), 2 + Math.floor(r() * 8), 1, "#2b2a4a", 0.5);
  }

  // moon
  px(svg, 92, 9, 12, 12, "#e9e7f7", 0.95);
  px(svg, 94, 9, 8, 12, "#f7f6ff", 0.9);
  px(svg, 90, 11, 16, 8, "#e9e7f7", 0.08);
  px(svg, 88, 9, 20, 12, "#e9e7f7", 0.05);
  px(svg, 95, 12, 2, 2, "#cfcae6", 0.6);
  px(svg, 99, 16, 2, 2, "#cfcae6", 0.5);

  // far hills
  for (let x = 0; x < W; x += 4) {
    const h = 3 + Math.floor(r() * 4);
    px(svg, x, 56 - h, 4, h, "#1b1930", 0.9);
  }

  // mid ridge
  for (let x = 0; x < W; ) {
    const w = 4 + Math.floor(r() * 5);
    const h = 2 + Math.floor(r() * 5);
    px(svg, x, 62 - h, w, h, "#151327", 0.95);
    x += w;
  }

  // ground
  px(svg, 0, 76, W, 3, "#233018");
  px(svg, 0, 79, W, 3, "#2c3a1c");
  px(svg, 0, 82, W, 8, "#241a12");
  px(svg, 0, 82, W, 1, "#1b120c");

  // grass blades
  for (let i = 0; i < 120; i++) {
    const x = Math.floor(r() * W);
    px(svg, x, 75, 1, 2, r() < 0.5 ? "#3d5222" : "#31501f", 0.85);
  }

  // dirt speckles
  for (let i = 0; i < 90; i++) {
    const x = Math.floor(r() * W);
    const y = 83 + Math.floor(r() * 7);
    px(svg, x, y, 1, 1, r() < 0.5 ? "#1b120c" : "#2e2116", 0.9);
  }

  // house
  const hx = 110, hy = 58;
  px(svg, hx, hy + 6, 26, 18, "#2a1c13");       // body
  px(svg, hx, hy + 6, 26, 1, "#3a2718");
  px(svg, hx - 2, hy + 4, 30, 3, "#3d2717");     // roof eave
  px(svg, hx + 1, hy, 24, 4, "#472c19");
  px(svg, hx + 4, hy - 3, 18, 3, "#52331c");
  px(svg, hx + 7, hy - 5, 12, 2, "#5b3a20");
  // windows
  px(svg, hx + 4, hy + 11, 5, 5, "#ffb347");
  px(svg, hx + 17, hy + 11, 5, 5, "#ffb347");
  px(svg, hx + 4, hy + 11, 5, 5, "#ffd27a", 0.5);
  px(svg, hx + 17, hy + 11, 5, 5, "#ffd27a", 0.5);
  // door
  px(svg, hx + 11, hy + 15, 4, 9, "#1a110b");
  px(svg, hx + 11, hy + 15, 4, 1, "#0f0a06");
  // glow around windows
  px(svg, hx + 2, hy + 9, 9, 9, "#ffb347", 0.06);
  px(svg, hx + 15, hy + 9, 9, 9, "#ffb347", 0.06);

  // torch
  const tx = 84, ty = 66;
  px(svg, tx, ty + 2, 2, 12, "#3b2a19");
  px(svg, tx - 1, ty, 4, 3, "#ff7a18");
  px(svg, tx - 1, ty - 2, 4, 2, "#ffc24a");
  px(svg, tx, ty - 3, 2, 1, "#ffe7a3");
  // torch glow
  px(svg, tx - 7, ty - 6, 16, 16, "#ff7a18", 0.05);
  px(svg, tx - 4, ty - 3, 10, 10, "#ff7a18", 0.07);

  // fireflies / grass sparks
  for (let i = 0; i < 26; i++) {
    const x = Math.floor(r() * W);
    const y = 62 + Math.floor(r() * 16);
    px(svg, x, y, 1, 1, "#8fe36b", (0.25 + r() * 0.5).toFixed(2));
  }

  // dense foreground stars near top edge
  for (let i = 0; i < 40; i++) {
    px(svg, Math.floor(r() * W), Math.floor(r() * 14), 1, 1, "#ffffff", (0.2 + r() * 0.5).toFixed(2));
  }
})();

/* ---------------- dither seam ---------------- */
(function seam() {
  const svg = document.getElementById("seam");
  const W = 160, H = 4;
  px(svg, 0, 0, W, H, "#f4f3f0");
  const tones = ["#241d2e", "#3d3350", "#6a5f7c", "#b3a9bd"];
  for (let row = 0; row < H; row++) {
    for (let col = 0; col < W; col++) {
      // classic 50% checker, offset per row, fading downward
      if ((col + row) % 2 === 0) px(svg, col, row, 1, 1, tones[row]);
    }
  }
})();

/* ---------------- 5x7 pixel digits ---------------- */
const DIGITS = {
  "0": ["01110", "10001", "10011", "10101", "11001", "10001", "01110"],
  "1": ["00100", "01100", "00100", "00100", "00100", "00100", "01110"],
  "2": ["01110", "10001", "00001", "00010", "00100", "01000", "11111"],
  "3": ["11110", "00001", "00001", "01110", "00001", "00001", "11110"],
  "4": ["00010", "00110", "01010", "10010", "11111", "00010", "00010"],
  "5": ["11111", "10000", "11110", "00001", "00001", "10001", "01110"],
  "6": ["00110", "01000", "10000", "11110", "10001", "10001", "01110"],
  "7": ["11111", "00001", "00010", "00100", "01000", "01000", "01000"],
  "8": ["01110", "10001", "10001", "01110", "10001", "10001", "01110"],
  "9": ["01110", "10001", "10001", "01111", "00001", "00010", "01100"],
};

function drawDigits(id, text, color) {
  const svg = document.getElementById(id);
  const cell = 3, gap = 3, dw = 5 * cell, dh = 7 * cell;
  let ox = 0;
  for (const ch of text) {
    const glyph = DIGITS[ch];
    if (glyph) {
      for (let y = 0; y < 7; y++) {
        for (let x = 0; x < 5; x++) {
          if (glyph[y][x] === "1") px(svg, ox + x * cell, y * cell, cell, cell, color);
        }
      }
    }
    ox += dw + gap;
  }
  svg.setAttribute("viewBox", `0 0 ${Math.max(ox - gap, 1)} ${dh}`);
  svg.style.width = `${(ox - gap) / dh * 26}px`;
}

drawDigits("d-min", "00", "#ff6a1a");
drawDigits("d-world", "00", "#ff6a1a");
drawDigits("d-server", "00", "#ff6a1a");

/* ---------------- instance block icon ---------------- */
(function block() {
  const svg = document.getElementById("block");
  const g = ["#8fbf4a", "#7fb03f", "#5c8a2e", "#4a7424"];
  px(svg, 0, 0, 16, 6, "#a9d95c");
  px(svg, 0, 6, 16, 10, "#6f4a2a");
  px(svg, 0, 6, 16, 1, "#54371f");
  for (let i = 0; i < 26; i++) {
    const r = rng(i * 977 + 13)();
    px(svg, Math.floor(r * 15), 1 + Math.floor(r * 5), 1, 1, g[Math.floor(r * 4)]);
  }
  for (let i = 0; i < 18; i++) {
    const r = rng(i * 331 + 7)();
    px(svg, Math.floor(r * 15), 7 + Math.floor(r * 8), 1, 1, "#4a2f1a");
  }
})();
</script>
</body>
</html>
