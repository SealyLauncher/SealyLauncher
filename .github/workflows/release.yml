name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump kind"
        type: choice
        options: [patch, minor, major, none]
        default: patch

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.99.1"

jobs:
  version:
    name: bump version and tag
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Compute next version
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          current=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          IFS=. read -r major minor patch <<< "$current"
          case "${{ github.event.inputs.bump || 'patch' }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
            none) ;;
          esac
          next="$major.$minor.$patch"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "tag=v$next" >> "$GITHUB_OUTPUT"
          echo "Releasing $current -> $next"

      - name: Bump manifest and lock
        if: steps.bump.outputs.version != steps.bump.outputs.current
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.bump.outputs.version }}"
          sed -i -E "0,/^version = \".*\"/s//version = \"$version\"/" Cargo.toml
          cargo metadata --format-version 1 > /dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "chore(release): v$version [skip ci]"
          # Tags are created by the release action; pushing them from the
          # workflow token failed on this repository while branch pushes worked.
          git push origin HEAD:main

  windows:
    name: package (windows-x64)
    needs: version
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        env:
          SEALY_REQUIRE_ICON: "1"
        run: cargo build --release --locked -p sealy-app

      - name: Package portable zip
        shell: pwsh
        run: |
          $version = "${{ needs.version.outputs.version }}"
          $stage = "dist/SealyLauncher-$version-windows-x64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/release/sealy-launcher.exe" $stage
          Copy-Item README.md, LICENSE, THIRD_PARTY_NOTICES.md, OEM.conf.example $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/SealyLauncher-$version-windows-x64.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*.zip
          if-no-files-found: error

  macos:
    name: package (macos-universal)
    needs: version
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build universal binary
        run: |
          cargo build --release --locked -p sealy-app --target aarch64-apple-darwin
          cargo build --release --locked -p sealy-app --target x86_64-apple-darwin
          mkdir -p "dist/SealyLauncher.app/Contents/MacOS"
          mkdir -p "dist/SealyLauncher.app/Contents/Resources"
          lipo -create \
            "target/aarch64-apple-darwin/release/sealy-launcher" \
            "target/x86_64-apple-darwin/release/sealy-launcher" \
            -output "dist/SealyLauncher.app/Contents/MacOS/sealy-launcher"

      - name: Package app
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"
          cp packaging/macos/Info.plist "dist/SealyLauncher.app/Contents/Info.plist"
          sed -i '' "s/0\.1\.0/${version}/g" "dist/SealyLauncher.app/Contents/Info.plist"
          cp packaging/macos/SealyLauncher.icns "dist/SealyLauncher.app/Contents/Resources/"
          cp README.md LICENSE THIRD_PARTY_NOTICES.md OEM.conf.example \
            "dist/SealyLauncher.app/Contents/Resources/"
          codesign --force --deep --sign - "dist/SealyLauncher.app"
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/SealyLauncher.app" \
            "dist/SealyLauncher-${version}-macos-universal.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: dist/*.zip
          if-no-files-found: error

  linux:
    name: package (linux-x86_64)
    needs: version
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Point apt at upstream mirrors
        timeout-minutes: 3
        run: |
          # The Azure mirror host intermittently fails DNS on hosted runners.
          sudo tee /etc/apt/sources.list > /dev/null <<'EOF'
          deb http://archive.ubuntu.com/ubuntu jammy main restricted universe multiverse
          deb http://archive.ubuntu.com/ubuntu jammy-updates main restricted universe multiverse
          deb http://archive.ubuntu.com/ubuntu jammy-backports main restricted universe multiverse
          deb http://security.ubuntu.com/ubuntu jammy-security main restricted universe multiverse
          EOF
          sudo rm -f /etc/apt/apt-mirrors.txt

      - name: Refresh apt indexes
        continue-on-error: true
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          for attempt in 1 2 3; do
            sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=2 \
              -o Acquire::http::Timeout=15 update && exit 0
            sleep 10
          done
          exit 1

      - name: Install Linux dependencies
        continue-on-error: true
        timeout-minutes: 20
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          packages="build-essential pkg-config clang cmake ninja-build zstd \
            libfontconfig1-dev libfreetype-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcb-render0-dev libxcb-randr0-dev libxcb-util-dev libxcb-keysyms1-dev \
            libxcb-icccm4-dev libxcb-xkb-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libvulkan-dev libgl1-mesa-dev libssl-dev"
          for attempt in 1 2 3; do
            if sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 \
                -o Acquire::http::Timeout=30 -o APT::Get::Lock-Timeout=60 \
                -o Dpkg::Use-Pty=0 install -y --no-install-recommends $packages; then
              exit 0
            fi
            sleep 15
          done
          exit 1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build and package
        run: |
          set -euo pipefail
          cargo build --release --locked -p sealy-app
          version="${{ needs.version.outputs.version }}"
          stage="dist/SealyLauncher-${version}-linux-x86_64"
          mkdir -p "$stage"
          cp target/release/sealy-launcher "$stage/"
          cp README.md LICENSE THIRD_PARTY_NOTICES.md OEM.conf.example "$stage/"
          cp packaging/linux/sealy-launcher.desktop "$stage/"
          cp packaging/linux/sealy-launcher.png "$stage/"
          tar --zstd -cf "dist/SealyLauncher-${version}-linux-x86_64.tar.zst" -C dist "$(basename "$stage")"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/*.tar.zst
          if-no-files-found: error

  publish:
    name: publish release
    needs: [version, windows, macos, linux]
    if: ${{ always() && !cancelled() && needs.windows.result == 'success' && needs.linux.result == 'success' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: main
          name: SealyLauncher ${{ needs.version.outputs.version }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
