name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  quality-windows:
    name: quality (windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Build
        run: cargo build --workspace --locked

  build-unix:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"

      - name: Point apt at upstream mirrors
        if: runner.os == 'Linux'
        timeout-minutes: 3
        run: |
          # The Azure mirror host intermittently fails DNS on hosted runners
          # ("Temporary failure resolving 'azure.archive.ubuntu.com'").
          sudo tee /etc/apt/sources.list > /dev/null <<'EOF'
          deb http://archive.ubuntu.com/ubuntu jammy main restricted universe multiverse
          deb http://archive.ubuntu.com/ubuntu jammy-updates main restricted universe multiverse
          deb http://archive.ubuntu.com/ubuntu jammy-backports main restricted universe multiverse
          deb http://security.ubuntu.com/ubuntu jammy-security main restricted universe multiverse
          EOF
          sudo rm -f /etc/apt/apt-mirrors.txt

      - name: Refresh apt indexes
        continue-on-error: true
        if: runner.os == 'Linux'
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          for attempt in 1 2 3; do
            sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=2 \
              -o Acquire::http::Timeout=15 update && exit 0
            sleep 10
          done
          exit 1

      - name: Install Linux dependencies
        continue-on-error: true
        if: runner.os == 'Linux'
        timeout-minutes: 20
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          packages="build-essential pkg-config clang cmake ninja-build \
            libfontconfig1-dev libfreetype-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcb-render0-dev libxcb-randr0-dev libxcb-util-dev libxcb-keysyms1-dev \
            libxcb-icccm4-dev libxcb-xkb-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libvulkan-dev libgl1-mesa-dev libssl-dev"
          for attempt in 1 2 3; do
            if sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 \
                -o Acquire::http::Timeout=30 -o APT::Get::Lock-Timeout=60 \
                -o Dpkg::Use-Pty=0 install -y --no-install-recommends $packages; then
              exit 0
            fi
            sleep 15
          done
          exit 1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --locked
